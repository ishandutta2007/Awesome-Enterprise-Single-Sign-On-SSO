<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -1px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .protocol-label {
        font-family: 'SF Mono', Consolas, Monaco, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #38bdf8;
      }

      /* Animated Glowing Orbs */
      @keyframes float-slow {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-20px) translateX(15px); }
      }
      @keyframes pulse-light {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.45; }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -40; }
      }

      .floating-orb1 {
        animation: float-slow 8s ease-in-out infinite, pulse-light 5s ease-in-out infinite;
      }
      .floating-orb2 {
        animation: float-slow 10s ease-in-out infinite reverse, pulse-light 7s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8 12;
        animation: dash-flow 2s linear infinite;
      }
      .shield-pulse {
        animation: pulse-light 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Animated Ambient Light Orbs (Background layer) -->
  <g opacity="0.35">
    <circle class="floating-orb1" cx="200" cy="80" r="160" fill="#6366f1" filter="url(#soft-glow)" />
    <circle class="floating-orb2" cx="980" cy="120" r="180" fill="#a855f7" filter="url(#soft-glow)" />
    <circle class="floating-orb1" cx="600" cy="360" r="140" fill="#06b6d4" filter="url(#soft-glow)" />
  </g>

  <!-- Cyber Grid Pattern Overlay -->
  <g opacity="0.12" stroke="#64748b" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Authentication Flow Lines (Background animated accents) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5">
    <!-- Curved auth flow path -->
    <path d="M 120 340 C 350 310, 450 370, 720 340 S 950 310, 1080 340" class="flowing-line" />
    <path d="M 160 365 C 380 340, 520 395, 800 365 S 1020 340, 1120 365" stroke="#a855f7" class="flowing-line" style="animation-duration: 3s;" />
  </g>

  <!-- Main Content Area: Foreground Header (Guaranteed visible and in foreground) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="16" cy="16" r="5" fill="#22c55e" />
    <text x="32" y="21" class="tag-text" fill="#c7d2fe">ENTERPRISE IAM &amp; SSO</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome <tspan fill="url(#primary-glow)">Enterprise Single Sign-On</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle-text">
      Curated Architecture Guide, SaaS Pricing Matrix &amp; Self-Hosted Open-Source IdPs
    </text>

    <!-- Key Protocol Feature Pills -->
    <g transform="translate(0, 155)">
      <!-- SAML 2.0 -->
      <rect x="0" y="0" width="112" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="18" y="22" class="tag-text">🛡️ SAML 2.0</text>

      <!-- OIDC / OAuth 2.0 -->
      <rect x="124" y="0" width="138" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="142" y="22" class="tag-text">⚡ OIDC / OAuth</text>

      <!-- SCIM Sync -->
      <rect x="274" y="0" width="128" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="292" y="22" class="tag-text">🔄 SCIM 2.0</text>

      <!-- Multi-Factor Auth -->
      <rect x="414" y="0" width="144" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="432" y="22" class="tag-text">🔑 FIDO2 / MFA</text>

      <!-- Zero-Trust / RBAC -->
      <rect x="570" y="0" width="148" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.2" />
      <text x="588" y="22" class="tag-text">🌐 Zero-Trust IdP</text>
    </g>
  </g>

  <!-- Interactive Graphic: Identity Provider Hub on the Right (Foreground Graphic) -->
  <g transform="translate(940, 130)">
    <!-- Central IdP Shield -->
    <circle cx="90" cy="90" r="64" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" class="shield-pulse" />
    <circle cx="90" cy="90" r="50" fill="#0f172a" stroke="#6366f1" stroke-width="1.5" />
    <!-- Lock / Key SVG Icon -->
    <path d="M 80 84 L 80 76 C 80 70.5 84.5 66 90 66 C 95.5 66 100 70.5 100 76 L 100 84 M 74 84 L 106 84 C 108.2 84 110 85.8 110 88 L 110 106 C 110 108.2 108.2 110 106 110 L 74 110 C 71.8 110 70 108.2 70 106 L 70 88 C 70 85.8 71.8 84 74 84 Z" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="90" cy="95" r="2.5" fill="#38bdf8" />
    <text x="90" y="125" text-anchor="middle" class="protocol-label" fill="#a5b4fc">IDP CORE</text>

    <!-- Satellite Nodes: Applications / SPs -->
    <g transform="translate(90, 90)">
      <!-- Node 1: SaaS Apps -->
      <line x1="0" y1="0" x2="-80" y2="-60" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="-80" cy="-60" r="16" fill="#1f2937" stroke="#38bdf8" stroke-width="1.5" />
      <text x="-80" y="-56" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#ffffff">SP</text>

      <!-- Node 2: Cloud / K8s -->
      <line x1="0" y1="0" x2="85" y2="-50" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="85" cy="-50" r="16" fill="#1f2937" stroke="#a855f7" stroke-width="1.5" />
      <text x="85" y="-46" text-anchor="middle" font-size="10" font-family="sans-serif" fill="#ffffff">API</text>

      <!-- Node 3: Directory / LDAP -->
      <line x1="0" y1="0" x2="-80" y2="65" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="-80" cy="65" r="16" fill="#1f2937" stroke="#22c55e" stroke-width="1.5" />
      <text x="-80" y="69" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#ffffff">LDAP</text>

      <!-- Node 4: Mobile / FIDO2 -->
      <line x1="0" y1="0" x2="85" y2="60" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3" />
      <circle cx="85" cy="60" r="16" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
      <text x="85" y="64" text-anchor="middle" font-size="9" font-family="sans-serif" fill="#ffffff">MFA</text>
    </g>
  </g>

  <!-- Bottom Border Line Glow -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-glow)" rx="2" />
</svg>